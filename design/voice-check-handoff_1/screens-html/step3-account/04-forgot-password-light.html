<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390, initial-scale=1">
<title>04-forgot-password-light</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:wght@500;600&display=swap" rel="stylesheet">
<style>body{margin:0}</style></head>
<body>

<div id="dc-root"><div class="sc-host" data-sc-name="AuthL4"><div class="sc-host" data-sc-name="Auth" data-dc-tpl="4"><div data-dc-tpl="4" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: rgb(248, 244, 236); color: rgb(31, 45, 58); font-family: &quot;Atkinson Hyperlegible&quot;, system-ui, sans-serif; padding: 59px 24px 34px; display: flex; flex-direction: column; gap: 16px;">

  
    <div data-dc-tpl="6" style="display: flex; align-items: center; min-height: 48px; margin-left: -8px;">
      <button data-dc-tpl="7" aria-label="Back" style="min-height: 48px; min-width: 64px; padding: 0px 12px; border: none; background: transparent; color: rgb(31, 76, 96); font-family: inherit; font-size: 20px; font-weight: 700; text-align: left;">Back</button>
    </div>
  

  
  

  
  

  
  
    <div data-dc-tpl="60" style="flex: 1 1 0%; display: flex; flex-direction: column; gap: 16px;">
      <h1 data-dc-tpl="61" style="margin: 0px; font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 34px; line-height: 40px;">Reset your password</h1>
      <p data-dc-tpl="62" style="margin: 0px; font-size: 21px; line-height: 30px; color: rgb(62, 75, 88); text-wrap: pretty;">Enter the email you signed up with. We will send you a link to choose a new password.</p>
      <div data-dc-tpl="63" style="display: flex; flex-direction: column; gap: 8px;">
        <label data-dc-tpl="64" for="fp-email" style="font-size: 19px; font-weight: 700;">Email</label>
        <input data-dc-tpl="65" id="fp-email" type="email" value="margaret@example.com" style="height: 60px; width: 100%; box-sizing: border-box; border-radius: 16px; border: 3px solid rgb(31, 45, 58); background: rgb(255, 255, 255); color: rgb(31, 45, 58); padding: 0px 18px; font-family: inherit; font-size: 21px;">
      </div>
      <div data-dc-tpl="66" style="flex: 1 1 0%;"></div>
      <button data-dc-tpl="67" style="height: 64px; border-radius: 20px; border: none; background: rgb(43, 95, 117); color: rgb(255, 255, 255); font-family: inherit; font-size: 22px; font-weight: 700;">Send reset link</button>
      <button data-dc-tpl="68" style="min-height: 48px; border: none; background: transparent; color: rgb(31, 76, 96); font-family: inherit; font-size: 20px; font-weight: 700; text-decoration: underline;">Back to log in</button>
    </div>
  

  
  

  
  

  
  

  
  </div></div></div></div>




</body></html>

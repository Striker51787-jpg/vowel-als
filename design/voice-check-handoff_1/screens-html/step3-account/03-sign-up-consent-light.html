<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390, initial-scale=1">
<title>03-sign-up-consent-light</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:wght@500;600&display=swap" rel="stylesheet">
<style>body{margin:0}</style></head>
<body>

<div id="dc-root"><div class="sc-host" data-sc-name="AuthL3"><div class="sc-host" data-sc-name="Auth" data-dc-tpl="4"><div data-dc-tpl="4" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: rgb(248, 244, 236); color: rgb(31, 45, 58); font-family: &quot;Atkinson Hyperlegible&quot;, system-ui, sans-serif; padding: 59px 24px 34px; display: flex; flex-direction: column; gap: 16px;">

  
    <div data-dc-tpl="6" style="display: flex; align-items: center; min-height: 48px; margin-left: -8px;">
      <button data-dc-tpl="7" aria-label="Back" style="min-height: 48px; min-width: 64px; padding: 0px 12px; border: none; background: transparent; color: rgb(31, 76, 96); font-family: inherit; font-size: 20px; font-weight: 700; text-align: left;">Back</button>
    </div>
  

  
  

  
  
    <div data-dc-tpl="37" style="flex: 1 1 0%; display: flex; flex-direction: column; gap: 16px;">
      <h1 data-dc-tpl="38" style="margin: 0px; font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 34px; line-height: 40px;">Create your account</h1>
      <div data-dc-tpl="39" style="display: flex; flex-direction: column; gap: 8px;">
        <label data-dc-tpl="40" for="su-email" style="font-size: 19px; font-weight: 700;">Email</label>
        <input data-dc-tpl="41" id="su-email" type="email" value="margaret@example.com" style="height: 60px; width: 100%; box-sizing: border-box; border-radius: 16px; border: 2px solid rgb(221, 213, 198); background: rgb(255, 255, 255); color: rgb(31, 45, 58); padding: 0px 18px; font-family: inherit; font-size: 21px;">
      </div>
      <div data-dc-tpl="42" style="display: flex; flex-direction: column; gap: 8px;">
        <label data-dc-tpl="43" for="su-pass" style="font-size: 19px; font-weight: 700;">Password</label>
        <div data-dc-tpl="44" style="position: relative;">
          <input data-dc-tpl="45" id="su-pass" type="password" value="a-long-password" style="height: 60px; width: 100%; box-sizing: border-box; border-radius: 16px; border: 3px solid rgb(31, 45, 58); background: rgb(255, 255, 255); color: rgb(31, 45, 58); padding: 0px 84px 0px 18px; font-family: inherit; font-size: 21px;">
          <button data-dc-tpl="46" style="position: absolute; right: 4px; top: 6px; height: 48px; min-width: 64px; border: none; background: transparent; color: rgb(31, 76, 96); font-family: inherit; font-size: 19px; font-weight: 700;">Show</button>
        </div>
        <div data-dc-tpl="47" style="font-size: 17px; line-height: 24px; color: rgb(62, 75, 88);">At least 8 characters.</div>
      </div>

      <div data-dc-tpl="48" style="flex: 1 1 0%;"></div>

      <div data-dc-tpl="49" style="background: rgb(230, 239, 242); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
        <button data-dc-tpl="50" aria-pressed="true" style="display: flex; align-items: flex-start; gap: 14px; padding: 0px; border: none; background: transparent; color: rgb(31, 45, 58); font-family: inherit; text-align: left; min-height: 48px;">
          <div data-dc-tpl="51" aria-hidden="true" style="flex: 0 0 auto; width: 28px; height: 28px; border-radius: 8px; background: rgb(43, 95, 117); display: flex; align-items: center; justify-content: center;">
            <div data-dc-tpl="52" style="width: 15px; height: 8px; border-left: 3px solid rgb(255, 255, 255); border-bottom: 3px solid rgb(255, 255, 255); transform: rotate(-45deg); margin-top: -3px;"></div>
          </div>
          <span data-dc-tpl="53" style="font-size: 19px; line-height: 26px;">I understand Voice Check is a research screening prototype. It is <b data-dc-tpl="54">not a diagnosis</b> and not a medical test.</span>
        </button>
      </div>
      <button data-dc-tpl="55" style="height: 64px; border-radius: 20px; border: none; background: rgb(43, 95, 117); color: rgb(255, 255, 255); font-family: inherit; font-size: 22px; font-weight: 700;">Create account</button>
      <div data-dc-tpl="56" style="display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; font-size: 19px;">
        <span data-dc-tpl="57" style="color: rgb(62, 75, 88);">Already have an account?</span>
        <button data-dc-tpl="58" style="min-height: 48px; padding: 0px 4px; border: none; background: transparent; color: rgb(31, 76, 96); font-family: inherit; font-size: 19px; font-weight: 700; text-decoration: underline;">Log in</button>
      </div>
    </div>
  

  
  

  
  

  
  

  
  

  
  </div></div></div></div>

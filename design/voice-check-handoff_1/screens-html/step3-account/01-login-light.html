<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390, initial-scale=1">
<title>01-login-light</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:wght@500;600&display=swap" rel="stylesheet">
<style>body{margin:0}</style></head>
<body>

<div id="dc-root"><div class="sc-host" data-sc-name="AuthL1"><div class="sc-host" data-sc-name="Auth" data-dc-tpl="4"><div data-dc-tpl="4" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: rgb(248, 244, 236); color: rgb(31, 45, 58); font-family: &quot;Atkinson Hyperlegible&quot;, system-ui, sans-serif; padding: 59px 24px 34px; display: flex; flex-direction: column; gap: 16px;">

  

  
  
    <div data-dc-tpl="9" style="flex: 1 1 0%; display: flex; flex-direction: column; gap: 16px;">
      <div data-dc-tpl="10" style="display: flex; align-items: center; gap: 12px; min-height: 48px;">
        <div data-dc-tpl="11" aria-hidden="true" style="width: 48px; height: 48px; border-radius: 24px; background: rgb(43, 95, 117); display: flex; align-items: center; justify-content: center; gap: 3px;">
          <div data-dc-tpl="12" style="width: 4px; height: 10px; border-radius: 2px; background: rgb(255, 255, 255);"></div>
          <div data-dc-tpl="13" style="width: 4px; height: 22px; border-radius: 2px; background: rgb(255, 255, 255);"></div>
          <div data-dc-tpl="14" style="width: 4px; height: 30px; border-radius: 2px; background: rgb(255, 255, 255);"></div>
          <div data-dc-tpl="15" style="width: 4px; height: 18px; border-radius: 2px; background: rgb(255, 255, 255);"></div>
          <div data-dc-tpl="16" style="width: 4px; height: 8px; border-radius: 2px; background: rgb(255, 255, 255);"></div>
        </div>
        <div data-dc-tpl="17" style="font-size: 22px; font-weight: 700;">Voice Check</div>
      </div>
      <h1 data-dc-tpl="18" style="margin: 8px 0px 0px; font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 34px; line-height: 40px;">Welcome back.</h1>
      <p data-dc-tpl="19" style="margin: 0px; font-size: 21px; line-height: 30px; color: rgb(62, 75, 88);">Log in to continue your voice checks.</p>

      

      <div data-dc-tpl="22" style="display: flex; flex-direction: column; gap: 8px;">
        <label data-dc-tpl="23" for="login-email" style="font-size: 19px; font-weight: 700;">Email</label>
        <input data-dc-tpl="24" id="login-email" type="email" value="margaret@example.com" style="height: 60px; width: 100%; box-sizing: border-box; border-radius: 16px; border: 2px solid rgb(221, 213, 198); background: rgb(255, 255, 255); color: rgb(31, 45, 58); padding: 0px 18px; font-family: inherit; font-size: 21px;">
      </div>
      <div data-dc-tpl="25" style="display: flex; flex-direction: column; gap: 8px;">
        <label data-dc-tpl="26" for="login-pass" style="font-size: 19px; font-weight: 700;">Password</label>
        <div data-dc-tpl="27" style="position: relative;">
          <input data-dc-tpl="28" id="login-pass" type="password" value="wrongpassword" style="height: 60px; width: 100%; box-sizing: border-box; border-radius: 16px; border: 2px solid rgb(221, 213, 198); background: rgb(255, 255, 255); color: rgb(31, 45, 58); padding: 0px 84px 0px 18px; font-family: inherit; font-size: 21px;">
          <button data-dc-tpl="29" style="position: absolute; right: 4px; top: 6px; height: 48px; min-width: 64px; border: none; background: transparent; color: rgb(31, 76, 96); font-family: inherit; font-size: 19px; font-weight: 700;">Show</button>
        </div>
      </div>
      <button data-dc-tpl="30" style="align-self: flex-start; min-height: 48px; padding: 0px; border: none; background: transparent; color: rgb(31, 76, 96); font-family: inherit; font-size: 19px; font-weight: 700; text-decoration: underline;">Forgot your password?</button>

      <div data-dc-tpl="31" style="flex: 1 1 0%;"></div>
      <button data-dc-tpl="32" style="height: 64px; border-radius: 20px; border: none; background: rgb(43, 95, 117); color: rgb(255, 255, 255); font-family: inherit; font-size: 22px; font-weight: 700;">Log in</button>
      <div data-dc-tpl="33" style="display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; font-size: 19px;">
        <span data-dc-tpl="34" style="color: rgb(62, 75, 88);">New here?</span>
        <button data-dc-tpl="35" style="min-height: 48px; padding: 0px 4px; border: none; background: transparent; color: rgb(31, 76, 96); font-family: inherit; font-size: 19px; font-weight: 700; text-decoration: underline;">Create an account</button>
      </div>
    </div>
  

  
  

  
  

  
  

  
  

  
  

  
  </div></div></div></div>




</body></html>

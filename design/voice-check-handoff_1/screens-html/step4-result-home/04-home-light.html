<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390, initial-scale=1">
<title>04-home-light</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:wght@500;600&display=swap" rel="stylesheet">
<style>body{margin:0}</style></head>
<body>
<div id="dc-root"><div class="sc-host" data-sc-name="HomeL1"><div class="sc-host" data-sc-name="Home" data-dc-tpl="2"><div data-dc-tpl="4" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: rgb(248, 244, 236); color: rgb(31, 45, 58); font-family: &quot;Atkinson Hyperlegible&quot;, system-ui, sans-serif; padding-top: 59px; display: flex; flex-direction: column;">

  <div data-dc-tpl="5" style="flex: 1 1 0%; min-height: 0px; overflow: hidden; padding: 8px 24px 0px; display: flex; flex-direction: column; gap: 16px;">
    <div data-dc-tpl="6" style="display: flex; flex-direction: column; gap: 4px;">
      <h1 data-dc-tpl="7" style="margin: 0px; font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 34px; line-height: 40px;">Hello, Margaret.</h1>
      <div data-dc-tpl="8" style="font-size: 21px; line-height: 30px; color: rgb(62, 75, 88);"><span class="sc-interp">Ready when you are.</span></div>
    </div>

    <div data-dc-tpl="9" style="background: rgb(255, 255, 255); border: 1px solid rgb(221, 213, 198); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
      <div data-dc-tpl="10" style="font-size: 22px; font-weight: 700;"><span class="sc-interp">Start a voice check</span></div>
      <div data-dc-tpl="11" style="font-size: 19px; line-height: 27px; color: rgb(62, 75, 88);"><span class="sc-interp">Eight short tasks, about 2 minutes.</span></div>
      <button data-dc-tpl="12" style="height: 64px; border-radius: 20px; border: none; background: rgb(43, 95, 117); color: rgb(255, 255, 255); font-family: inherit; font-size: 22px; font-weight: 700;"><span class="sc-interp">Start a voice check</span></button>
    </div>

    
      <button data-dc-tpl="14" style="text-align: left; background: rgb(255, 255, 255); border: 1px solid rgb(221, 213, 198); border-radius: 24px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; color: rgb(31, 45, 58); font-family: inherit;">
        <div data-dc-tpl="15" style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
          <div data-dc-tpl="16" style="font-size: 17px; font-weight: 700; color: rgb(62, 75, 88);">Your latest result</div>
          <div data-dc-tpl="17" style="font-size: 17px; color: rgb(62, 75, 88);">14 Oct</div>
        </div>
        <div data-dc-tpl="18" style="display: flex; align-items: center; gap: 14px;">
          <div data-dc-tpl="19" style="flex: 0 0 auto; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 26px; line-height: 26px; padding: 8px 16px 10px; border-radius: 14px; background: rgb(233, 188, 98); color: rgb(31, 45, 58);"><span class="sc-interp">Borderline</span></div>
          <div data-dc-tpl="20" style="font-size: 18px; line-height: 25px;">Some patterns were not clear.</div>
        </div>
        <div data-dc-tpl="21" style="font-size: 19px; font-weight: 700; color: rgb(31, 76, 96); text-decoration: underline;">Read your result</div>
      </button>

      <div data-dc-tpl="22" style="display: flex; flex-direction: column; gap: 4px;">
        <div data-dc-tpl="23" style="font-size: 17px; font-weight: 700; color: rgb(62, 75, 88); padding: 0px 4px;">Earlier checks</div>
        
          <button data-dc-tpl="25" style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0px 4px; border-top: none; border-right: none; border-left: none; border-image: initial; border-bottom: 1px solid rgb(221, 213, 198); background: transparent; color: rgb(31, 45, 58); font-family: inherit; font-size: 19px;">
            <span data-dc-tpl="26"><span class="sc-interp">2 Sep 2026</span></span>
            <span data-dc-tpl="27" style="font-size: 18px; font-weight: 700; padding: 6px 14px; border-radius: 12px; background: rgb(211, 230, 238); color: rgb(31, 45, 58);"><span class="sc-interp">Low</span></span>
          </button>
        
          <button data-dc-tpl="25" style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0px 4px; border-top: none; border-right: none; border-left: none; border-image: initial; border-bottom: 1px solid rgb(221, 213, 198); background: transparent; color: rgb(31, 45, 58); font-family: inherit; font-size: 19px;">
            <span data-dc-tpl="26"><span class="sc-interp">19 Aug 2026</span></span>
            <span data-dc-tpl="27" style="font-size: 18px; font-weight: 700; padding: 6px 14px; border-radius: 12px; background: rgb(211, 230, 238); color: rgb(31, 45, 58);"><span class="sc-interp">Low</span></span>
          </button>
        
      </div>
    

    
  </div>

  <div data-dc-tpl="33" style="padding: 0px 24px 8px; font-size: 17px; line-height: 24px; color: rgb(62, 75, 88); text-align: center;">A screening, not a diagnosis.</div>

  <div data-dc-tpl="34" style="display: flex; border-top: 1px solid rgb(221, 213, 198); background: rgb(248, 244, 236); padding: 0px 8px 34px;">
    
      <button data-dc-tpl="36" aria-current="page" style="flex: 1 1 0%; min-height: 56px; border: none; background: transparent; color: rgb(31, 76, 96); font-family: inherit; font-size: 18px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0px;">
        <span data-dc-tpl="37"><span class="sc-interp">Home</span></span>
        <div data-dc-tpl="38" style="width: 28px; height: 4px; border-radius: 2px; background: rgb(43, 95, 117);"></div>
      </button>
    
      <button data-dc-tpl="36" aria-current="false" style="flex: 1 1 0%; min-height: 56px; border: none; background: transparent; color: rgb(62, 75, 88); font-family: inherit; font-size: 18px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0px;">
        <span data-dc-tpl="37"><span class="sc-interp">Results</span></span>
        <div data-dc-tpl="38" style="width: 28px; height: 4px; border-radius: 2px; background: transparent;"></div>
      </button>
    
      <button data-dc-tpl="36" aria-current="false" style="flex: 1 1 0%; min-height: 56px; border: none; background: transparent; color: rgb(62, 75, 88); font-family: inherit; font-size: 18px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0px;">
        <span data-dc-tpl="37"><span class="sc-interp">Learn</span></span>
        <div data-dc-tpl="38" style="width: 28px; height: 4px; border-radius: 2px; background: transparent;"></div>
      </button>
    
      <button data-dc-tpl="36" aria-current="false" style="flex: 1 1 0%; min-height: 56px; border: none; background: transparent; color: rgb(62, 75, 88); font-family: inherit; font-size: 18px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0px;">
        <span data-dc-tpl="37"><span class="sc-interp">Settings</span></span>
        <div data-dc-tpl="38" style="width: 28px; height: 4px; border-radius: 2px; background: transparent;"></div>
      </button>
    
  </div></div></div></div></div>

</body></html>

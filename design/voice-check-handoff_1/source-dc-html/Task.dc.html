<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Task 1 of 8</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #1F2D3A;outline-offset:3px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F4EC; color: #1F2D3A; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; padding: 16px 24px 32px; display: flex; flex-direction: column; gap: 20px">
  <div style="display: flex; align-items: center; gap: 4px; margin-left: -8px">
    <a href="Setup.dc.html" aria-label="Back" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #1F2D3A; text-decoration: none">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4 7 13l9 9"/></svg>
    </a>
    <div style="font-size: 20px; font-weight: 700">Task 1 of 8</div>
  </div>

  <div style="display: flex; gap: 6px" aria-hidden="true">
    <sc-for list="{{segs}}" as="seg" hint-placeholder-count="8">
      <div style="flex: 1; height: 8px; border-radius: 4px; background: {{seg.color}}"></div>
    </sc-for>
  </div>

  <div style="background: #FFFFFF; border: 1px solid #DDD5C6; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 12px; margin-top: 8px">
    <div style="font-size: 18px; color: #3E4B58">Hold a sound</div>
    <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 32px; line-height: 1.2">Say &ldquo;ahhh&rdquo; for as long as feels comfortable.</div>
    <div style="font-size: 19px; line-height: 1.45; color: #3E4B58">Take a slow breath in first. There is no wrong way to do this.</div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center">
    <sc-if value="{{isIdle}}" hint-placeholder-val="{{ true }}">
      <button onClick="{{start}}" aria-label="Start recording" style="width: 136px; height: 136px; border-radius: 50%; border: 8px solid #D6E5EA; background: #2B5F75; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0">
        <svg width="56" height="56" viewBox="0 0 56 56" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="20" y="6" width="16" height="30" rx="8"/><path d="M12 28a16 16 0 0 0 32 0M28 44v6M20 50h16"/></svg>
      </button>
      <div style="font-size: 22px; font-weight: 700">Tap to start</div>
    </sc-if>

    <sc-if value="{{isRec}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 96px" aria-hidden="true">
        <sc-for list="{{bars}}" as="bar" hint-placeholder-count="15">
          <div style="width: 8px; height: {{bar.h}}px; border-radius: 4px; background: #2B5F75"></div>
        </sc-for>
      </div>
      <div style="font-size: 22px; font-weight: 700">Listening. Keep going.</div>
      <button onClick="{{stop}}" style="height: 64px; width: 100%; border-radius: 20px; border: 3px solid #2B5F75; background: #FFFFFF; color: #1F4C60; font-family: inherit; font-size: 22px; font-weight: 700; cursor: pointer">Stop</button>
    </sc-if>

    <sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
      <div style="width: 96px; height: 96px; border-radius: 50%; background: #D6E5EA; display: flex; align-items: center; justify-content: center">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="#1F4C60" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 25l10 10 18-20"/></svg>
      </div>
      <div style="font-size: 24px; font-weight: 700">Thank you. That was clear.</div>
      <div style="display: flex; flex-direction: column; gap: 12px; width: 100%">
        <a href="Complete.dc.html" style="display: flex; align-items: center; justify-content: center; height: 64px; border-radius: 20px; background: #2B5F75; color: #FFFFFF; font-size: 23px; font-weight: 700; text-decoration: none">Next task</a>
        <button onClick="{{redo}}" style="height: 56px; border-radius: 16px; border: none; background: transparent; color: #1F4C60; font-family: inherit; font-size: 20px; font-weight: 700; text-decoration: underline; cursor: pointer">Record this one again</button>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { phase: 'idle' };
}
renderVals() {
const phase = this.state.phase;
const heights = [18, 30, 46, 62, 40, 78, 54, 86, 50, 70, 36, 58, 28, 40, 20];
return {
isIdle: phase === 'idle',
isRec: phase === 'rec',
isDone: phase === 'done',
segs: Array.from({ length: 8 }, (_, i) => ({ color: i === 0 ? '#2B5F75' : '#DDD5C6' })),
bars: heights.map((h) => ({ h })),
start: () => this.setState({ phase: 'rec' }),
stop: () => this.setState({ phase: 'done' }),
redo: () => this.setState({ phase: 'idle' })
};
}
}
</script>
</body>
</html>
